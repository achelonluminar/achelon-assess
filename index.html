<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Achelon Luminar Academy – Examinations</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
:root{--navy:#1C3F73;--ink:#12284D;--gold:#C6A15B;--gold2:#E9D9B0;--iv:#FBF9F4;--line:#E6DFCF;--ok:#2E7D5B;--bad:#B3402A;--mut:#6B7385;--serif:'Times New Roman',Times,serif;--sans:Calibri,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}#app{height:100%}
body{font:16px/1.55 var(--serif);color:var(--ink);background:var(--iv)}
h1,h2,h3,.sn{font-family:var(--serif);margin:0;font-weight:700}
h1{font-size:34px}h2{font-size:26px}h3{font-size:21px}.sn{font-size:22px;letter-spacing:.5px}
.mut,small{color:var(--mut)}small{font-family:var(--sans);font-size:13px}
label{display:block;font-family:var(--sans);font-weight:700;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input[type=radio],input[type=checkbox]{width:auto}
.btn{font-family:var(--sans);font-size:15px;font-weight:700;border:0;border-radius:8px;padding:10px 20px;background:var(--navy);color:#fff;cursor:pointer}
.btn:hover{background:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.w{width:100%;margin-top:18px;padding:13px}.btn.sm{padding:6px 12px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 6px 24px rgba(28,63,115,.06)}
.lg{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--navy),var(--ink))}
.lc{background:#fff;border-radius:16px;padding:36px;width:100%;max-width:400px;text-align:center;border-top:5px solid var(--gold)}
.lc input{text-align:left}.lgo{height:110px}.lc p{margin:6px 0 10px}.err{color:var(--bad);min-height:1.2em;margin:8px 0 0}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;z-index:99;border-left:4px solid var(--gold);font-family:var(--sans);font-size:15px}.toast.bad{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(18,40,77,.65);display:grid;place-items:center;z-index:50;padding:16px}
.mb{background:#fff;border-radius:14px;padding:28px;max-width:560px;width:100%;max-height:90vh;overflow:auto;border-top:5px solid var(--gold)}.mb h3{margin-bottom:8px}.mb ul{padding-left:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.hall{max-width:640px;margin:0 auto;padding:36px 20px;text-align:center}.hall img{height:110px}
.cd{font:700 56px var(--serif);color:var(--navy);margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;text-align:left;margin:18px 0 0;font-weight:600}.chk input{margin-top:4px}
.xs{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.xh{display:grid;grid-template-columns:1fr 2fr 1fr;gap:12px;padding:10px 20px;background:#fff;border-bottom:3px solid var(--gold);align-items:start}
.xlogo{height:62px}.inf{margin-top:4px;font-family:var(--sans);font-size:14px}.inf summary{cursor:pointer;font-weight:700;color:var(--navy)}.inf dl{margin:6px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.inf dt{color:var(--mut)}.inf dd{margin:0;font-weight:600}
.xt{text-align:center}.xr{text-align:right}.tm{font:700 40px var(--serif);color:var(--navy);line-height:1}.tm.low{color:var(--bad)}
#pa{display:flex;flex-direction:column;min-height:0}
.trk{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px;background:var(--ink)}.trk button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:#fff;font:700 14px var(--sans);cursor:pointer}.trk button.dn{background:var(--gold);color:var(--ink)}
.aud{padding:10px 20px;background:var(--gold2);border-bottom:1px solid var(--gold);font-weight:700}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}.split .pane:first-child{border-right:2px solid var(--line);background:#fff}
.pane{overflow:auto;padding:22px 26px}.one{flex:1;min-height:0;width:100%;max-width:900px;margin:0 auto}
.mt{white-space:pre-wrap;font:18px/1.8 var(--serif);margin-bottom:16px}.mi{max-width:100%;border-radius:8px;margin-bottom:12px}
.q{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.qn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 15px var(--sans)}.qb{flex:1;min-width:0}.qp{font-weight:600;margin-bottom:8px;font-size:17px}
.op{display:flex;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:#fff}.op:hover{border-color:var(--gold)}.op b{color:var(--gold);font-family:var(--sans)}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg .op{margin:0}
.wc{font-family:var(--sans);font-size:13px;color:var(--mut);text-align:right}
.xf{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#fff;border-top:1px solid var(--line)}
.brk{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.sh{display:flex;gap:18px;align-items:center;padding:10px 24px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);flex-wrap:wrap}.sh img,.sh svg{height:56px;background:#fff;border-radius:8px;padding:3px}.sh nav{flex:1;display:flex;gap:4px;flex-wrap:wrap}
.sh nav button{background:transparent;border:0;color:#fff;font:700 15px var(--sans);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent}.sh nav button.on{border-color:var(--gold);color:var(--gold2)}
.sm{max-width:1100px;margin:0 auto;padding:24px 20px;overflow:auto}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:15px}th{background:var(--navy);color:#fff;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--gold2);font-family:var(--sans);font-size:13px;font-weight:700}
.gq{padding:10px 0;border-bottom:1px solid var(--line)}.tw{overflow:auto}
@media(max-width:800px){.xh{grid-template-columns:1fr}.xr,.xt{text-align:left}.split{grid-template-columns:1fr;overflow:auto;display:block}.split .pane{overflow:visible}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.qe{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--iv)}.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px}.qh select{flex:1}.qh input{width:80px}.qe textarea,.qe .fg{margin-top:6px}
@media print{#pr{display:none}body{background:#fff}.card{box-shadow:none}}
</style></head>

  for(let j=0;j<p.questions.length;j++){const q=p.questions[j];if(!q.prompt.trim())return toast(`Paper ${i+1}, question ${j+1} needs a question text.`);if(KIND[q.type]!=='essay'&&!String(q.answer||'').trim())return toast(`Paper ${i+1}, question ${j+1} needs a correct answer.`);if(['choice','multi','select'].includes(KIND[q.type])&&(q.options||[]).filter(x=>x.trim()).length<2)return toast(`Paper ${i+1}, question ${j+1} needs at least two options.`)}}
 const e=JSON.parse(JSON.stringify(d));e.title=e.title.trim();e.start=new Date(d.start).toISOString();
 e.papers.forEach(p=>p.questions.forEach(q=>{q.options=(q.options||[]).map(z=>z.trim()).filter(Boolean)}));
 if(b){b.disabled=true;b.textContent='Saving…'}
 try{const r=await R('saveExam',TOK,e);D=r.data;dr=null;rerender();toast('Exam saved. Exam code: '+r.code,true)}catch(er){if(b){b.disabled=false;b.textContent='Save exam'}toast(er.message||er)}}
function tCands(){const L2=D.cands.filter(inO);
 $('#sp').innerHTML=`<div class="bar"><h2>Candidates</h2></div>${fBar()}<div class="card"><div class="fg"><div><label>Exam</label>${exSel('rc')}</div><div><label>Full name</label><input id="rn"></div><div><label>Class</label><input id="rl"></div><div><label>Email</label><input id="re"></div></div><button class="btn" style="margin-top:14px" onclick="reg(this)">Register student</button></div>
 <div class="card tw"><table><tr><th>Exam</th>${adm()?'<th>Teacher</th>':''}<th>Username</th><th>Passcode</th><th>Name</th><th>Class</th><th>Email</th><th></th></tr>${L2.map(c=>`<tr><td>${esc(c.Code)}</td>${adm()?`<td>${esc(tname(ownerOf(c.Code)))}</td>`:''}<td><b>${esc(c.Username)}</b></td><td><b>${esc(c.Passcode)}</b></td><td>${esc(c.Name)}</td><td>${esc(c.Class)}</td><td>${esc(c.Email)}</td><td><button class="btn sm ghost" onclick="lnk('${esc(c.Code)}','${esc(c.Username)}',this)">Email login</button></td></tr>`).join('')||`<tr><td colspan="${adm()?8:7}" class="mut">No students registered yet.</td></tr>`}</table></div>`}
function tStaff(){$('#sp').innerHTML=`<div class="bar"><h2>Staff</h2></div><div class="card"><h3>Add a teacher or administrator</h3><div class="fg"><div><label for="sn1">Full name</label><input id="sn1"></div><div><label for="se">Email</label><input id="se" type="email"></div><div><label for="su2">Username <small>(optional)</small></label><input id="su2" autocomplete="off" placeholder="Made from the email if left empty"></div><div><label for="sr">Role</label><select id="sr"><option value="teacher">Teacher</option><option value="admin">Administrator</option></select></div></div>
 <label class="chk" style="margin-top:12px"><input type="checkbox" id="sm" checked> Email the login details to this person</label><button class="btn" style="margin-top:14px" onclick="addStaff(this)">Create account</button></div>
 <div class="card tw"><table><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Exams</th><th></th></tr>${D.staff.map(r=>{const me=r.Username===D.me.user;return`<tr><td>${esc(r.Name)}${me?' <span class="tag">You</span>':''}</td><td><b>${esc(r.Username)}</b>${r.Pending?' <span class="tag">Temporary password</span>':''}</td><td>${esc(r.Email)}</td><td>${r.Role==='admin'?'Administrator':'Teacher'}</td><td>${r.Exams}</td><td>${me?'':`<button class="btn sm ghost" onclick="resetPw('${esc(r.Username)}',this)">Reset password</button> <button class="btn sm ghost" onclick="delStaff('${esc(r.Username)}',this)">Remove</button>`}</td></tr>`}).join('')}</table></div>`}
const showCred=(r,what)=>modal(`<h3>${what}</h3><p>Give these details to the person. <b>The password is shown only once</b> and must be changed at first sign-in.</p><div class="card" style="font-family:var(--sans);font-size:17px;line-height:2;margin-top:12px">Username: <b>${esc(r.username)}</b><br>Temporary password: <b>${esc(r.password)}</b></div><p class="mut">${r.emailed?'The details were also sent by email.':'No email was sent.'}</p><button class="btn w" onclick="closeM()">Done</button>`);
// The server sends back fresh data with each change, so the screen updates in one trip instead of two.
const addStaff=b=>busy(b,async()=>{try{const r=await R('addStaff',TOK,{name:$('#sn1').value.trim(),email:$('#se').value.trim(),username:$('#su2').value.trim(),role:$('#sr').value,sendEmail:$('#sm').checked},location.origin+location.pathname);D=r.data;rerender();showCred(r,'Account created')}catch(e){toast(e.message||e)}},'Creating…');
const resetPw=(u,b)=>{if(!confirm('Reset the password for '+u+'? A new temporary password will be shown here, and emailed to them if an email address is on file.'))return;return busy(b,async()=>{try{const r=await R('resetStaffPassword',TOK,u,location.origin+location.pathname);D=r.data;rerender();showCred(r,'Password reset')}catch(e){toast(e.message||e)}},'Resetting…')};
const delStaff=(u,b)=>{if(!confirm('Remove '+u+'? Their exams will be transferred to you, and they will be signed out immediately.'))return;return busy(b,async()=>{try{D=await R('deleteStaff',TOK,u);rerender()}catch(e){toast(e.message||e)}},'Removing…')};
const reg=b=>busy(b,async()=>{const v={c:$('#rc').value.trim(),n:$('#rn').value.trim(),l:$('#rl').value.trim(),e:$('#re').value.trim()};try{const r=await R('register',TOK,v.c,v.n,v.l,v.e);D.cands.push({Code:v.c,Username:r.user,Passcode:r.pass,Name:v.n,Class:v.l,Email:v.e});rerender();toast(`Created username ${r.user}, passcode ${r.pass}`,true)}catch(e){toast(e.message||e)}},'Registering…');
const lnk=(c,u,b)=>busy(b,async()=>{try{await R('sendLink',TOK,c,u,location.origin+location.pathname);toast('Login email sent.',true)}catch(e){toast(e.message||e)}},'Sending…');
// Written answers are fetched only when a submission is opened, then kept for the rest of the session.
const getAns=async i=>{const r=D.subs[i];if(r.Answers==null)r.Answers=await R('getAnswers',TOK,r.Code,r.Username);return JSON.parse(r.Answers||'{}')};
const view=async i=>{const r=D.subs[i];modal('<h3>Loading answers…</h3>');try{const a=await getAns(i);modal(`<h3>Answers</h3>${D.questions.filter(q=>q.Code==r.Code).map((q,n)=>`<div class="gq"><b>${n+1}.</b> ${esc(q.Prompt)}<br>Answer: <b>${esc(a[q.Id])||'–'}</b><br><small>Key: ${esc(q.Answer)||'(marked by teacher)'}</small></div>`).join('')}<button class="btn w" onclick="closeM()">Close</button>`,true)}catch(e){closeM();toast(e.message||e)}};
// The marking window: read the written answers, enter marks, and write the comment that goes into the result email and PDF.
const gr=async i=>{const r=D.subs[i];modal('<h3>Loading answers…</h3>');let a;try{a=await getAns(i)}catch(e){closeM();return toast(e.message||e)}
 const mq=D.questions.filter(q=>q.Code==r.Code&&KIND[q.Type]==='essay'),mx=mq.reduce((s,q)=>s+(q.Points===''?1:+q.Points),0);
 modal(`<h3>Mark and comment</h3><p class="mut">${esc(nameOf(r))} · ${esc(r.Code)}</p>
 ${mq.length?mq.map(q=>`<div class="gq"><b>${esc(q.Prompt)}</b><div style="white-space:pre-wrap;margin-top:6px">${esc(a[q.Id])||'<span class="mut">No answer</span>'}</div><small>${wc(a[q.Id])} words</small></div>`).join(''):'<p class="mut">This exam has no written questions. Use the box below for speaking or other marks.</p>'}
 <label for="gm">Marks for written and speaking work${mx?` <small>(the written questions are worth ${mx} in total)</small>`:''}</label><input id="gm" type="number" min="0" step="0.5" value="${esc(r.Manual)}">
 <label for="gc">Comment for the student <small>(shown in the result email and PDF)</small></label><textarea id="gc" rows="5" placeholder="Strengths, areas to improve, advice for next time…">${esc(r.Comment||'')}</textarea>
 <div class="row" style="margin-top:16px"><button class="btn gold" onclick="saveGrade(${i},this)">Save marks and comment</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`,true)};
const saveGrade=(i,b)=>busy(b,async()=>{const r=D.subs[i];try{const g=await R('grade',TOK,r.Code,r.Username,$('#gm').value||0,$('#gc').value.trim());Object.assign(r,g);closeM();rerender();toast('Marks and comment saved.',true)}catch(e){toast(e.message||e)}},'Saving…');
const rel=(i,b)=>{const r=D.subs[i],nc=!String(r.Comment||'').trim();if(!confirm((nc?'No teacher comment has been added for this student yet.\n\n':'')+'Email the result PDF to this student?'))return;return busy(b,async()=>{try{await R('release',TOK,r.Code,r.Username,location.origin+location.pathname);r.Status='Released';rerender();toast('Result emailed.',true)}catch(e){toast(e.message||e)}},'Sending…')};

async function resultView(){shell(`<div class="brk"><div class="card"><h2>Loading your result…</h2></div></div>`);
 try{const d=await R('getResult',P.get('r'),P.get('c'),P.get('u'));
  shell(`<div class="hall" style="max-width:760px">${logo()}<div class="sn">${SCHOOL}</div><p class="mut" style="font-family:var(--sans);font-size:13px;letter-spacing:3px;margin:2px 0 14px">EXAMINATION RESULT</p>
  <h1>${esc(d.name)}</h1><p class="mut">${esc(d.cls)}<br><b style="color:var(--ink)">${esc(d.title)}</b> · ${esc(d.when)} · ${esc(d.code)}</p>
  <div class="row" style="justify-content:center;gap:0;margin:18px 0"><div style="background:var(--navy);color:#fff;padding:20px 34px;border-radius:12px 0 0 12px"><small style="color:var(--gold2);letter-spacing:3px">TOTAL SCORE</small><div class="cd" style="color:#fff;margin:0">${d.total} <span style="font-size:28px;color:var(--gold2)">/ ${d.max}</span></div></div><div style="background:var(--gold);color:var(--ink);padding:20px 34px;border-radius:0 12px 12px 0"><small style="letter-spacing:3px;color:var(--ink)">OVERALL</small><div class="cd" style="color:var(--ink);margin:0">${d.pct}%</div></div></div>
  <div class="card tw" style="text-align:left"><table><tr><th>Paper</th><th>Section</th><th style="text-align:right">Score</th></tr>${d.papers.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.section)}</td><td style="text-align:right">${p.face?'Face to face':p.max?p.score+' / '+p.max:'Teacher marked'}</td></tr>`).join('')}${d.manual?`<tr><td>Teacher-marked work</td><td>Writing and speaking</td><td style="text-align:right">${d.manual}</td></tr>`:''}<tr><td><b>Total</b></td><td></td><td style="text-align:right"><b>${d.total} / ${d.max}</b></td></tr></table></div>
  <div class="card" style="text-align:left;border-left:4px solid var(--gold)"><b>Teacher's comments</b><p style="white-space:pre-wrap;margin:6px 0 0">${esc(d.comment)||'No comments were added.'}</p></div>
  <button class="btn gold" id="pr">Save or print as PDF</button></div>`);$('#pr').onclick=()=>window.print()}
 catch(e){shell(`<div class="brk"><div class="card"><h2>Result unavailable</h2><p class="err">${esc(e.message||e)}</p></div></div>`)}}
if(P.get('r'))resultView();else if(STAFF)(TOK?staff():staffLoginView());else loginView();
</script></body></html>
