const SCHOOL='Achelon Luminar Academy';
const P=new URLSearchParams(location.search);let TOK='';try{TOK=sessionStorage.getItem('alst')||''}catch(e){}
const setTok=t=>{TOK=t||'';try{t?sessionStorage.setItem('alst',t):sessionStorage.removeItem('alst')}catch(e){}};
const STAFF=P.has('staff')||P.has('t')||P.has('a');
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isDrive=s=>/drive\.google\.com|docs\.google\.com|^[-\w]{25,}$/.test(String(s||'').trim());
const pic=(u,c)=>isDrive(u)?`<img class="${c}" data-drv="${esc(u)}" alt="Loading picture…">`:`<img class="${c}" src="${esc(u)}" alt="">`;
const FC={},PP={};
const getF=ref=>FC[ref]||(FC[ref]=R('getFile',S.tok,ref).catch(e=>{delete FC[ref];throw e}));
const getP=i=>PP[i]||(PP[i]=R('getPaper',S.tok,S.exam.papers[i].n).catch(e=>{delete PP[i];throw e}));
// Loads a paper (and its pictures and recording) in the background so it opens instantly.

function paperEd(p,i){const sp=p.type==='speaking',b=`papers.${i}.`;
 return`<div class="card"><div class="bar"><h3>Paper ${i+1}</h3><button class="btn sm ghost" onclick="dr.papers.splice(${i},1);edView()">Remove paper</button></div>
 <div class="fg"><div><label>Paper name</label><input data-b="${b}name" value="${esc(p.name)}"></div><div><label>Section type</label><select data-b="${b}type" data-rr="1">${Object.keys(PT).map(k=>`<option value="${k}" ${p.type===k?'selected':''}>${PT[k]}</option>`).join('')}</select></div>
 ${sp?'':`<div><label>Time for this paper</label><select data-n="1" data-b="${b}minutes">${durOpts(p.minutes)}</select></div><div><label>Break after this paper</label><select data-n="1" data-b="${b}breakMin">${brkOpts(p.breakMin)}</select></div>`}</div>
 ${sp?'<p class="mut">Speaking is taken face to face. Enter the examiner\'s score and comments under Submissions, Mark.</p>':`
 ${p.type==='listening'?`<label>Audio (Google Drive link or file ID, plays once)</label><input data-b="${b}audio" value="${esc(p.audio||'')}">`:''}
 <label>${p.type==='reading'?'Reading text (shown on the left screen)':p.type==='writing'?'Writing topic or task (shown at the top)':'Instructions or passage (optional)'}</label><textarea rows="5" data-b="${b}material">${esc(p.material||'')}</textarea>
 <label>Picture, map or diagram (Google Drive link or image link, shown on the left screen, optional)</label><input data-b="${b}image" value="${esc(p.image||'')}">
 ${p.questions.map((q,j)=>qEd(i,j,q,p)).join('')}<button class="btn sm gold" onclick="dr.papers[${i}].questions.push({id:nid(),type:PQ[dr.papers[${i}].type][0],prompt:'',options:[],answer:'',points:1,image:''});edView()">Add question</button>`}</div>`}
const HINT={choice:'Correct letter, e.g. B',multi:'Correct letters, e.g. A,C',select:'Correct letter, e.g. C',text:'Accepted answers, separated by |',area:'Accepted answers, separated by |'};
function qEd(i,j,q,p){const k=KIND[q.type]||'text',b=`papers.${i}.questions.${j}.`,types=PQ[p.type].includes(q.type)?PQ[p.type]:PQ[p.type].concat([q.type]);
 const opt=['choice','multi','select'].includes(k)||q.type==='cloze';let ans;
 if(k==='tf'||k==='yn'){const vs=k==='tf'?['True','False','Not Given']:['Yes','No','Not Given'];ans=`<select data-b="${b}answer">${vs.map(v=>`<option ${q.answer===v?'selected':''}>${v}</option>`).join('')}</select>`;if(!vs.includes(q.answer))q.answer=vs[0]}
 else if(k==='essay')ans='<small>Marked by the teacher after submission.</small>';
 else ans=`<input data-b="${b}answer" placeholder="${HINT[k]}" value="${esc(q.answer||'')}">`;
 return`<div class="qe"><div class="qh"><b>Q${j+1}</b><select data-b="${b}type" data-rr="1">${types.map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${QT[t][0]}</option>`).join('')}</select><input type="number" min="0" data-n="1" data-b="${b}points" value="${q.points}" title="Points"><button class="btn sm ghost" onclick="dr.papers[${i}].questions.splice(${j},1);edView()" aria-label="Remove question">×</button></div>
 <textarea rows="2" data-b="${b}prompt" placeholder="Question, statement or instruction">${esc(q.prompt)}</textarea>
 ${opt?`<textarea rows="3" data-arr="1" data-b="${b}options" placeholder="${q.type==='cloze'?'Word bank, one per line (optional)':q.type==='match_heading'?'Headings, one per line (A, B, C… in order)':'Options, one per line (A, B, C… in order)'}">${esc((q.options||[]).join('\n'))}</textarea>`:''}
 <div class="fg"><div>${ans}</div><div><input data-b="${b}image" placeholder="Picture link (optional)" value="${esc(q.image||'')}"></div></div></div>`}
const setP=(o,p,v)=>{const a=p.split('.');for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v};
const setB=t=>{let v=t.value;if(t.dataset.n)v=Number(v)||0;if(t.dataset.arr)v=v.split('\n');setP(dr,t.dataset.b,v)};
document.addEventListener('input',e=>{const t=e.target;if(dr&&t.dataset&&t.dataset.b&&!t.dataset.rr)setB(t)});
document.addEventListener('change',e=>{const t=e.target;if(dr&&t.dataset&&t.dataset.b){setB(t);if(t.dataset.rr){const m=t.dataset.b.match(/^papers\.(\d+)\.type$/);if(m&&t.value==='speaking')dr.papers[m[1]].questions=[];edView()}}});
async function saveExam(b){const d=dr;if(!d.title.trim())return toast('Add an exam title.');if(!d.start)return toast('Choose the date and time.');if(!d.papers.length)return toast('Add at least one paper.');
 for(let i=0;i<d.papers.length;i++){const p=d.papers[i];if(p.type==='speaking')continue;if(!p.questions.length)return toast(`Paper ${i+1} has no questions.`);
  for(let j=0;j<p.questions.length;j++){const q=p.questions[j];if(!q.prompt.trim())return toast(`Paper ${i+1}, question ${j+1} needs a question text.`);if(KIND[q.type]!=='essay'&&!String(q.answer||'').trim())return toast(`Paper ${i+1}, question ${j+1} needs a correct answer.`);if(['choice','multi','select'].includes(KIND[q.type])&&(q.options||[]).filter(x=>x.trim()).length<2)return toast(`Paper ${i+1}, question ${j+1} needs at least two options.`)}}
 const e=JSON.parse(JSON.stringify(d));e.title=e.title.trim();e.start=new Date(d.start).toISOString();
 e.papers.forEach(p=>p.questions.forEach(q=>{q.options=(q.options||[]).map(z=>z.trim()).filter(Boolean)}));
 if(b){b.disabled=true;b.textContent='Saving…'}
 try{const r=await R('saveExam',TOK,e);D=r.data;dr=null;rerender();toast('Exam saved. Exam code: '+r.code,true)}catch(er){if(b){b.disabled=false;b.textContent='Save exam'}toast(er.message||er)}}

const rel=(i,b)=>{const r=D.subs[i],nc=!String(r.Comment||'').trim();if(!confirm((nc?'No teacher comment has been added for this student yet.\n\n':'')+'Email the result PDF to this student?'))return;return busy(b,async()=>{try{await R('release',TOK,r.Code,r.Username,location.origin+location.pathname);r.Status='Released';rerender();toast('Result emailed.',true)}catch(e){toast(e.message||e)}},'Sending…')};

async function resultView(){shell(`<div class="brk"><div class="card"><h2>Loading your result…</h2></div></div>`);
 try{const d=await R('getResult',P.get('r'),P.get('c'),P.get('u'));
  shell(`<div class="hall" style="max-width:760px">${logo()}<div class="sn">${SCHOOL}</div><p class="mut" style="font-family:var(--sans);font-size:13px;letter-spacing:3px;margin:2px 0 14px">EXAMINATION RESULT</p>
  <h1>${esc(d.name)}</h1><p class="mut">${esc(d.cls)}<br><b style="color:var(--ink)">${esc(d.title)}</b> · ${esc(d.when)} · ${esc(d.code)}</p>
  <div class="row" style="justify-content:center;gap:0;margin:18px 0"><div style="background:var(--navy);color:#fff;padding:20px 34px;border-radius:12px 0 0 12px"><small style="color:var(--gold2);letter-spacing:3px">TOTAL SCORE</small><div class="cd" style="color:#fff;margin:0">${d.total} <span style="font-size:28px;color:var(--gold2)">/ ${d.max}</span></div></div><div style="background:var(--gold);color:var(--ink);padding:20px 34px;border-radius:0 12px 12px 0"><small style="letter-spacing:3px;color:var(--ink)">OVERALL</small><div class="cd" style="color:var(--ink);margin:0">${d.pct}%</div></div></div>
  <div class="card tw" style="text-align:left"><table><tr><th>Paper</th><th>Section</th><th style="text-align:right">Score</th></tr>${d.papers.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.section)}</td><td style="text-align:right">${p.face?'Face to face':p.max?p.score+' / '+p.max:'Teacher marked'}</td></tr>`).join('')}${d.manual?`<tr><td>Teacher-marked work</td><td>Writing and speaking</td><td style="text-align:right">${d.manual}</td></tr>`:''}<tr><td><b>Total</b></td><td></td><td style="text-align:right"><b>${d.total} / ${d.max}</b></td></tr></table></div>
  <div class="card" style="text-align:left;border-left:4px solid var(--gold)"><b>Teacher's comments</b><p style="white-space:pre-wrap;margin:6px 0 0">${esc(d.comment)||'No comments were added.'}</p></div>
  <button class="btn gold" id="pr">Save or print as PDF</button></div>`);$('#pr').onclick=()=>window.print()}
 catch(e){shell(`<div class="brk"><div class="card"><h2>Result unavailable</h2><p class="err">${esc(e.message||e)}</p></div></div>`)}}
if(P.get('r'))resultView();else if(STAFF)(TOK?staff():staffLoginView());else loginView();
</script></body></html>
